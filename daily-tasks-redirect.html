<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中...</title>
<style>
body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f4f8; margin:0; }
.box { text-align:center; padding:40px; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.spinner { width:36px; height:36px; border:3px solid #e2e8f0; border-top-color:#0052cc; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }
.error { color:#e53e3e; }
a { color:#0052cc; }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner" id="spinner"></div>
  <div id="msg">正在跳转到工作安排页面...</div>
</div>
<script>
fetch('tunnel.json')
  .then(r => r.json())
  .then(data => {
    if (data.url) {
      window.location.href = data.url + '/daily-tasks.html';
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').innerHTML = '<span class="error">无法获取服务器地址，请稍后重试</span>';
    }
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').innerHTML = '<span class="error">网络错误，请稍后重试</span>';
  });
</script>
</body>
</html>
